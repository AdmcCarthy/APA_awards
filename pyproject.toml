[project]
name = "apa-awards"
version = "0.2.0"
description = "Close to Home: a SubScout data story on Norway's APA 2025 licensing round"
requires-python = ">=3.12"
dependencies = [
    "subscout",
]

[dependency-groups]
# Only needed to re-fetch and re-process Sodir data (scripts/); the story builds without them.
pipeline = [
    "requests>=2.31",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
subscout = { git = "https://github.com/AdmcCarthy/SubScout", tag = "v0.6.0" }

[tool.pytest.ini_options]
pythonpath = ["scripts"]
