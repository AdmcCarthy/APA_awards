name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q
      - run: uv run subscout build . --out _site
      - run: test -z "$(python3 -c 'import json;r=json.load(open("_site/build-report.json"));print("\n".join(r["warnings"]))')" || (echo "build warnings:"; python3 -c 'import json;print("\n".join(json.load(open("_site/build-report.json"))["warnings"]))'; exit 1)
